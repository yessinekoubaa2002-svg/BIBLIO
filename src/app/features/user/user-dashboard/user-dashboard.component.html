<div class="biblio-dashboard p-4">

  <!-- ================= HEADER ================= -->
  <p-card styleClass="mb-4 shadow-2 border-round-xl">

    <div class="flex justify-content-between align-items-center">

      <div>
        <h2 class="text-2xl font-bold m-0">Books Library</h2>
        <p class="text-500 mt-1">Browse, search and borrow books</p>
      </div>

      <i class="pi pi-book text-4xl text-primary"></i>

    </div>

  </p-card>

  <!-- ================= SEARCH SECTION ================= -->
  <p-card styleClass="mb-4 shadow-2 border-round-xl">

    <div class="grid">

      <!-- Search by Title -->
      <div class="col-12 md:col-4">
        <input pInputText
               type="text"
               class="w-full"
               placeholder="Search by title..."
               [(ngModel)]="searchText"
               (keyup.enter)="searchByTitle()" />
      </div>

      <div class="col-12 md:col-2">
        <button pButton
                label="Title"
                icon="pi pi-search"
                class="w-full"
                (click)="searchByTitle()">
        </button>
      </div>

      <!-- Search by Author -->
      <div class="col-12 md:col-4">
        <input pInputText
               type="text"
               class="w-full"
               placeholder="Search by author..."
               [(ngModel)]="authorText"
               (keyup.enter)="searchByAuthor()" />
      </div>

      <div class="col-12 md:col-2">
        <button pButton
                label="Author"
                icon="pi pi-user"
                class="p-button-secondary w-full"
                (click)="searchByAuthor()">
        </button>
      </div>

      <!-- Filter by Category -->
      <div class="col-12 md:col-4">
        <input pInputText
               type="text"
               class="w-full"
               placeholder="Filter by category..."
               [(ngModel)]="categoryText"
               (keyup.enter)="filterByCategory()" />
      </div>

      <div class="col-12 md:col-2">
        <button pButton
                label="Category"
                icon="pi pi-tag"
                class="p-button-info w-full"
                (click)="filterByCategory()">
        </button>
      </div>

    </div>

    <!-- FILTER BUTTONS -->
    <div class="flex gap-2 flex-wrap mt-4">

      <button pButton
              label="All"
              class="p-button-outlined"
              (click)="loadBooks()">
      </button>

      <button pButton
              label="Available"
              class="p-button-success p-button-outlined"
              (click)="filterAvailable()">
      </button>

      <button pButton
              label="Low Stock"
              class="p-button-warning p-button-outlined"
              (click)="filterLowStock()">
      </button>

      <button pButton
              label="Reset"
              class="p-button-secondary p-button-outlined"
              (click)="resetFilters()">
      </button>

    </div>

  </p-card>

  <!-- ================= BOOKS GRID ================= -->
  <div class="grid">

    <div class="col-12 md:col-6 lg:col-4"
         *ngFor="let book of books">

      <p-card styleClass="shadow-2 border-round-xl h-full">

        <div class="flex flex-column h-full">

          <h3 class="m-0 font-bold">
            {{ book.titre }}
          </h3>

          <p class="text-500 mt-2 mb-1">
            {{ book.auteur }}
          </p>

          <p class="text-500 m-0">
            {{ book.annee }}
          </p>

          <div class="mt-3">
            <strong>Stock:</strong>

            <span
              [ngClass]="book.quantite > 0 ? 'text-green-500' : 'text-red-500'">
              {{ book.quantite }}
            </span>
          </div>

          <div class="mt-3">
            <p-tag
              [value]="book.disponible ? 'Disponible' : 'Indisponible'"
              [severity]="book.disponible ? 'success' : 'danger'">
            </p-tag>
          </div>

          <p class="mt-3 text-500">
            <strong>Category:</strong>
            {{ book.category?.nom || 'Not defined' }}
          </p>

          <button pButton
                  label="Emprunter"
                  icon="pi pi-bookmark"
                  class="mt-auto p-button-primary"
                  (click)="borrow(book.id)"
                  [disabled]="book.quantite === 0">
          </button>

        </div>

      </p-card>

    </div>

    <!-- EMPTY STATE -->
    <div class="col-12 text-center text-500"
         *ngIf="books.length === 0">

      <p-card styleClass="shadow-1 border-round-xl">
        No books found.
      </p-card>

    </div>

  </div>

</div>
