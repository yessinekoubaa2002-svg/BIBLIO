<div class="biblio-container p-4">

  <!-- HEADER -->
  <p-card styleClass="mb-4 shadow-2 border-round-xl">

    <div class="flex justify-content-between align-items-center">

      <div>
        <h2 class="text-2xl font-bold m-0">Bibliothecaire Management</h2>
        <p class="text-500 mt-1">Manage librarian accounts</p>
      </div>

      <button pButton
              icon="pi pi-plus"
              label="New Bibliothecaire"
              class="p-button-primary"
              (click)="goCreate()">
      </button>

    </div>

  </p-card>

  <!-- STATS ONLY -->
  <div class="grid mb-4">

    <div class="col-12 md:col-6 lg:col-4">
      <p-card styleClass="shadow-2 border-round-xl text-center">
        <i class="pi pi-users text-3xl text-blue-500"></i>
        <h2 class="m-0 mt-2">{{ bibliothecaires.length }}</h2>
        <p class="text-500">Total Bibliothecaires</p>
      </p-card>
    </div>

    <div class="col-12 md:col-6 lg:col-4">
      <p-card styleClass="shadow-2 border-round-xl text-center">
        <i class="pi pi-check-circle text-3xl text-green-500"></i>
        <h2 class="m-0 mt-2">{{ bibliothecaires.length }}</h2>
        <p class="text-500">Active</p>
      </p-card>
    </div>

    <div class="col-12 md:col-6 lg:col-4">
      <p-card styleClass="shadow-2 border-round-xl text-center">
        <i class="pi pi-id-card text-3xl text-purple-500"></i>
        <h2 class="m-0 mt-2">BIB</h2>
        <p class="text-500">Role</p>
      </p-card>
    </div>

  </div>

  <!-- TABLE -->
  <p-card header="List of Bibliothecaires" styleClass="shadow-2 border-round-xl">

    <p-table
      [value]="bibliothecaires"
      [paginator]="true"
      [rows]="5"
      responsiveLayout="scroll">

      <!-- HEADER -->
      <ng-template pTemplate="header">
        <tr>
          <th>ID</th>
          <th>Nom</th>
          <th>Prenom</th>
          <th>Email</th>
          <th>Role</th>
          <th>Actions</th>
        </tr>
      </ng-template>

      <!-- BODY -->
      <ng-template pTemplate="body" let-b>
        <tr>
          <td>{{ b.id }}</td>
          <td>{{ b.nom }}</td>
          <td>{{ b.prenom }}</td>
          <td>{{ b.email }}</td>

          <td>
            <p-tag [value]="b.role" severity="warning"></p-tag>
          </td>

          <td class="flex gap-2">
            <button pButton icon="pi pi-pencil"
                    class="p-button-sm p-button-warning"
                    [routerLink]="['/admin/bibliothecaires/edit', b.id]">
            </button>

            <button pButton icon="pi pi-trash"
                    class="p-button-sm p-button-danger"
                    (click)="delete(b.id)">
            </button>
          </td>
        </tr>
      </ng-template>

      <!-- EMPTY -->
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6" class="text-center text-500">
            No bibliothecaires found
          </td>
        </tr>
      </ng-template>

    </p-table>

  </p-card>

</div>
