<div class="biblio-container p-4">

  <!-- HEADER -->
  <p-card styleClass="mb-4 shadow-2 border-round-xl">
    <div class="flex justify-content-between align-items-center">
      <div>
        <h2 class="text-2xl font-bold m-0">Edit User</h2>
        <p class="text-500 mt-1">Update user information</p>
      </div>
      <button pButton
              icon="pi pi-arrow-left"
              label="Back to Users"
              class="p-button-secondary"
              (click)="cancel()">
      </button>
    </div>
  </p-card>

  <!-- FORM -->
  <p-card styleClass="shadow-2 border-round-xl">

    <!-- Error -->
    <p-messages *ngIf="errorMsg" severity="error">
      <ng-template pTemplate>
        <span>{{ errorMsg }}</span>
      </ng-template>
    </p-messages>

    <div class="grid">

      <!-- Nom -->
      <div class="col-12 md:col-6">
        <label class="block font-semibold mb-1">Nom</label>
        <input pInputText
               [(ngModel)]="user.nom"
               placeholder="Nom"
               class="w-full" />
      </div>

      <!-- Prenom -->
      <div class="col-12 md:col-6">
        <label class="block font-semibold mb-1">Prénom</label>
        <input pInputText
               [(ngModel)]="user.prenom"
               placeholder="Prenom"
               class="w-full" />
      </div>

      <!-- Email -->
      <div class="col-12 md:col-6">
        <label class="block font-semibold mb-1">Email</label>
        <input pInputText
               [(ngModel)]="user.email"
               type="email"
               placeholder="Email"
               class="w-full" />
      </div>

      <!-- Telephone -->
      <div class="col-12 md:col-6">
        <label class="block font-semibold mb-1">Téléphone</label>
        <input pInputText
               [(ngModel)]="user.telephone"
               placeholder="Telephone"
               class="w-full" />
      </div>

      <!-- Password -->
      <div class="col-12 md:col-6">
        <label class="block font-semibold mb-1">New Password</label>
        <p-password [(ngModel)]="user.motDePasse"
                    placeholder="Leave blank to keep current"
                    [feedback]="false"
                    [toggleMask]="true"
                    styleClass="w-full">
        </p-password>
      </div>

      <!-- Role -->
      <div class="col-12 md:col-6">
        <label class="block font-semibold mb-1">Role</label>
        <p-dropdown [(ngModel)]="user.role"
                    [options]="[
                      { label: 'USER', value: 'USER' },
                      { label: 'BIBLIOTHECAIRE', value: 'BIBLIOTHECAIRE' },
                      { label: 'ADMIN', value: 'ADMIN' }
                    ]"
                    optionLabel="label"
                    optionValue="value"
                    styleClass="w-full">
        </p-dropdown>
      </div>

    </div>

    <!-- ACTIONS -->
    <div class="flex gap-2 mt-4">
      <button pButton
              icon="pi pi-check"
              [label]="loading ? 'Saving...' : 'Save Changes'"
              class="p-button-success"
              (click)="updateUser()"
              [disabled]="loading"
              [loading]="loading">
      </button>

      <button pButton
              icon="pi pi-times"
              label="Cancel"
              class="p-button-secondary"
              (click)="cancel()">
      </button>
    </div>

  </p-card>

</div>
