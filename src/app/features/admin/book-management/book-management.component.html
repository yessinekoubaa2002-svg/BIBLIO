<div class="biblio-dashboard p-4">

  <!-- HEADER -->
  <p-card styleClass="mb-4 shadow-2 border-round-xl">

    <div class="flex justify-content-between align-items-center">

      <div>
        <h2 class="text-2xl font-bold m-0">Books Management</h2>
        <p class="text-500 mt-1">Manage library collection</p>
      </div>

      <button pButton
              icon="pi pi-plus"
              label="Add Book"
              class="p-button-primary"
              (click)="goCreate()">
      </button>

    </div>

  </p-card>

  <!-- STATS -->
  <div class="grid mb-4">

    <div class="col-12 md:col-4">
      <p-card styleClass="shadow-2 border-round-xl text-center">
        <i class="pi pi-book text-3xl text-green-500"></i>
        <h2 class="m-0 mt-2">{{ livres.length }}</h2>
        <p class="text-500">Total Books</p>
      </p-card>
    </div>

  </div>

  <!-- TABLE -->
  <p-card header="Books List" styleClass="shadow-2 border-round-xl">

    <p-table [value]="livres"
             [paginator]="true"
             [rows]="5"
             responsiveLayout="scroll">

      <ng-template pTemplate="header">
        <tr>
          <th>Title</th>
          <th>Author</th>
          <th>ISBN</th>
          <th>Year</th>
          <th>Qty</th>
          <th>Actions</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-l>
        <tr>
          <td>{{ l.titre }}</td>
          <td>{{ l.auteur }}</td>
          <td>{{ l.isbn }}</td>
          <td>{{ l.annee }}</td>
          <td>{{ l.quantite }}</td>

          <td class="flex gap-2">
            <button pButton icon="pi pi-pencil"
                    class="p-button-sm p-button-warning"
                    (click)="goEdit(l.id)">
            </button>

            <button pButton icon="pi pi-trash"
                    class="p-button-sm p-button-danger"
                    (click)="delete(l.id)">
            </button>
          </td>
        </tr>
      </ng-template>

      <!-- EMPTY STATE FIX -->
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6" class="text-center text-500">
            No books found
          </td>
        </tr>
      </ng-template>

    </p-table>

  </p-card>

</div>
